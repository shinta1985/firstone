<svg width="1440" height="1050" viewBox="0 0 1440 1050" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">らくらく eBay 出品アシスタント UI sample</title>
  <desc id="desc">Japanese-first dashboard mockup showing a three-step eBay listing form, dry-run checkbox, and JSON confirmation panel.</desc>
  <defs>
    <linearGradient id="hero" x1="150" y1="85" x2="1280" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F62FE"/>
      <stop offset="1" stop-color="#6F6CFF"/>
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#1F2D3D" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1440" height="1050" fill="#F5F7FB"/>
  <rect x="140" y="70" width="1160" height="250" rx="34" fill="url(#hero)"/>
  <rect x="184" y="112" width="152" height="34" rx="17" fill="white" fill-opacity="0.22"/>
  <text x="204" y="134" fill="white" font-size="18" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="700">Sandbox / EBAY_US</text>
  <text x="184" y="210" fill="white" font-size="58" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="900">3ステップで eBay 出品</text>
  <text x="184" y="260" fill="white" fill-opacity="0.9" font-size="25" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">写真URL・価格・サイズを入れて、まずは dry run でAPI送信内容を確認します。</text>
  <rect x="1050" y="150" width="174" height="58" rx="29" fill="white"/>
  <text x="1082" y="187" fill="#0F62FE" font-size="21" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="800">eBayログイン</text>

  <g filter="url(#shadow)">
    <rect x="140" y="350" width="360" height="118" rx="22" fill="white"/>
    <rect x="540" y="350" width="360" height="118" rx="22" fill="white"/>
    <rect x="940" y="350" width="360" height="118" rx="22" fill="white"/>
  </g>
  <text x="172" y="397" fill="#172033" font-size="24" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="900">1. 商品入力</text>
  <text x="172" y="434" fill="#596579" font-size="20" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">英語タイトル、説明、価格、サイズ</text>
  <text x="572" y="397" fill="#172033" font-size="24" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="900">2. 送料確認</text>
  <text x="572" y="434" fill="#596579" font-size="20" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">配送会社料金を入力・後でAPI連携</text>
  <text x="972" y="397" fill="#172033" font-size="24" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="900">3. 出品/発送</text>
  <text x="972" y="434" fill="#596579" font-size="20" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">Inventory API → Fulfillment API</text>

  <g filter="url(#shadow)">
    <rect x="140" y="505" width="760" height="455" rx="24" fill="white"/>
    <rect x="930" y="505" width="370" height="455" rx="24" fill="white"/>
  </g>
  <text x="172" y="552" fill="#172033" font-size="28" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="900">商品情報を入力</text>
  <text x="172" y="593" fill="#172033" font-size="17" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="800">SKU</text>
  <rect x="172" y="608" width="320" height="50" rx="12" fill="#FBFCFF" stroke="#D7DEEA"/>
  <text x="192" y="641" fill="#172033" font-size="19" font-family="monospace">JP-SAMPLE-001</text>
  <text x="520" y="593" fill="#172033" font-size="17" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="800">英語タイトル</text>
  <rect x="520" y="608" width="340" height="50" rx="12" fill="#FBFCFF" stroke="#D7DEEA"/>
  <text x="540" y="641" fill="#172033" font-size="18" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">Vintage Japanese Ceramic Cup</text>

  <text x="172" y="693" fill="#172033" font-size="17" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="800">英語説明</text>
  <rect x="172" y="708" width="688" height="92" rx="12" fill="#FBFCFF" stroke="#D7DEEA"/>
  <text x="192" y="742" fill="#172033" font-size="18" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">Carefully stored in Japan.</text>
  <text x="192" y="773" fill="#172033" font-size="18" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">Please review photos before purchase.</text>

  <text x="172" y="837" fill="#172033" font-size="17" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="800">価格 USD</text>
  <rect x="172" y="852" width="145" height="50" rx="12" fill="#FBFCFF" stroke="#D7DEEA"/>
  <text x="192" y="885" fill="#172033" font-size="19" font-family="monospace">29.99</text>
  <text x="345" y="837" fill="#172033" font-size="17" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="800">重さ kg</text>
  <rect x="345" y="852" width="145" height="50" rx="12" fill="#FBFCFF" stroke="#D7DEEA"/>
  <text x="365" y="885" fill="#172033" font-size="19" font-family="monospace">0.5</text>
  <text x="518" y="837" fill="#172033" font-size="17" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="800">送料 USD</text>
  <rect x="518" y="852" width="145" height="50" rx="12" fill="#FBFCFF" stroke="#D7DEEA"/>
  <text x="538" y="885" fill="#172033" font-size="19" font-family="monospace">18.00</text>
  <rect x="690" y="852" width="170" height="50" rx="25" fill="#0F62FE"/>
  <text x="718" y="884" fill="white" font-size="19" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="900">出品内容を確認</text>

  <rect x="172" y="919" width="22" height="22" rx="5" fill="#0F62FE"/>
  <path d="M177 930 L182 935 L190 924" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="206" y="937" fill="#172033" font-size="18" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="700">dry run（APIへ送信せず確認）</text>

  <text x="962" y="552" fill="#172033" font-size="28" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="900">確認結果</text>
  <rect x="962" y="585" width="306" height="340" rx="16" fill="#101828"/>
  <text x="986" y="623" fill="#D1E7FF" font-size="17" font-family="monospace">{</text>
  <text x="1008" y="654" fill="#D1E7FF" font-size="17" font-family="monospace">"dry_run": true,</text>
  <text x="1008" y="685" fill="#D1E7FF" font-size="17" font-family="monospace">"steps": [</text>
  <text x="1030" y="716" fill="#7DD3FC" font-size="17" font-family="monospace">"在庫データ作成",</text>
  <text x="1030" y="747" fill="#7DD3FC" font-size="17" font-family="monospace">"出品オファー作成",</text>
  <text x="1030" y="778" fill="#7DD3FC" font-size="17" font-family="monospace">"出品公開"</text>
  <text x="1008" y="809" fill="#D1E7FF" font-size="17" font-family="monospace">],</text>
  <text x="1008" y="840" fill="#D1E7FF" font-size="17" font-family="monospace">"offer_id":</text>
  <text x="1030" y="871" fill="#A7F3D0" font-size="17" font-family="monospace">"DRY-RUN-OFFER"</text>
  <text x="986" y="902" fill="#D1E7FF" font-size="17" font-family="monospace">}</text>
</svg>
